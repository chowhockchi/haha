<!DOCTYPE html>
<html lang="en">

<title>Language and culture in socialization: tree diagram</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#18212f;--mute:#64708a;--line:#b9c2d3;--a:#3451d1;--b:#b4531a;--g:#0e7c6b;--hit:#f2b705;--root:#18212f;--ui:#e6eaf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2232;--ink:#e8ecf4;--mute:#93a0ba;--line:#3b4760;--a:#8ea2ff;--b:#f0925a;--g:#4fd1b8;--root:#e8ecf4;--ui:#252f44}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2232;--ink:#e8ecf4;--mute:#93a0ba;--line:#3b4760;--a:#8ea2ff;--b:#f0925a;--g:#4fd1b8;--root:#e8ecf4;--ui:#252f44}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Instrument Sans",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{padding:20px 20px 4px}
h1{font-size:22px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}

.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px}

.act{background:var(--ui);padding:6px 11px}

#lv button{flex:none;margin-right:28px;border:0;border-bottom:3px solid var(--line);background:transparent;text-align:left;padding:2px 0 4px;color:var(--mute);cursor:pointer;font-size:12px}
#lv button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.n{display:flex;align-items:center}
.kids{position:relative;display:flex;flex-direction:column;margin-left:14px}
.kids::before{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:1px solid var(--line)}
.k{position:relative;padding:3px 0 3px 14px}
.k::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:1px solid var(--line)}
.k::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
.k:first-child::after{top:50%}.k:last-child::after{bottom:50%}.k:only-child::after{display:none}
.box{flex:none;display:flex;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--c);border-left-width:5px;border-radius:7px;background:color-mix(in srgb,var(--c) 9%,var(--card));padding:5px 8px;font-size:12px;line-height:1.35;cursor:pointer}
.box.leaf{cursor:default;background:color-mix(in srgb,var(--c) 14%,var(--card))}
.box:hover:not(.leaf){background:color-mix(in srgb,var(--c) 18%,var(--card))}
.box .t{flex:1}
.box small{display:block;color:var(--mute);font-size:11px}
.box .pl{flex:none;font-size:11px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:10px;padding:0 6px;margin-top:1px}
.bA{--c:var(--a)}.bB{--c:var(--b)}.bG{--c:var(--g)}
.box.root{--c:var(--root);background:var(--root);color:var(--card);font-weight:600;font-size:13px}
.box.root small,.box.root .pl{color:var(--card);border-color:var(--card)}
.box.hit{box-shadow:0 0 0 3px var(--hit)}
mark{background:var(--hit);color:#18212f;border-radius:2px}
.key{display:flex;gap:14px;padding:0 20px 4px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<header>
<h1>Language and culture in socialization</h1>
<p>Click a box to open or close it. Use the level buttons to show the tree down to any depth.</p>
</header>
<div class="bar">
<div class="grp"><span>Show to level</span><div class="seg" id="lvBtns"></div></div>

<div class="stat" id="stat"></div>
</div>

<div id="wrap"><div id="inner"><div id="lv"></div><div id="tree"></div></div></div>
<script>
var k=0,W=[0,150,150,160,175,185,185,205];
function n(l){var c=[].slice.call(arguments,1).map(function(x){return typeof x==="string"?{l:"Action "+(++k)+"|"+x,c:[]}:x});return{l:l,c:c}}
var D=n("Root|Challenges of different languages and cultures on socialization",
n("A|Language and communication barriers",
 n("A1|Vocabulary differences",

n("B|Cultural and behavioral norms conflicts",

  n("B2.2|Different understandings of deadlines",

   n("B2.2.b|Working overtime vs. leaving on time culture",

var S={lv:4,br:"all",q:"",z:1},$=function(i){return document.getElementById(i)},total=0,vis=0,hits=0,deep=1;
function walk(x,lv,br,f){x.lv=lv;x.br=lv===2?x.l.split("|")[0]:br;x.leaf=!x.c.length;if(x.leaf)x.g=1;f&&f(x);x.c.forEach(function(c){walk(c,lv+1,x.br,f)})}
walk(D,1,"",function(){total++});

 vis++;if(x.lv>deep)deep=x.lv;

 d.className="n"+(x.lv>1?" k":"");

 var hit=S.q&&(id+" "+lb).toLowerCase().indexOf(S.q)>-1;if(hit)hits++;
 var t=esc(lb);if(hit){var i=lb.toLowerCase().indexOf(S.q);if(i>-1)t=esc(lb.slice(0,i))+"<mark>"+esc(lb.slice(i,i+S.q.length))+"</mark>"+esc(lb.slice(i+S.q.length))}
 b.className="box "+(x.lv===1?"root":x.g?"bG":"b"+x.br)+(x.leaf?" leaf":"")+(hit?" hit":"");
 b.style.width=W[x.lv]+"px";
 b.innerHTML='<span class="t">'+(x.lv>1&&!x.g?"<small>"+id+"</small>":x.g?"<small>"+id+"</small>":"")+t+"</span>"+(!x.leaf&&!x.open?'<span class="pl">+'+cnt(x)+"</span>":"");
 if(!x.leaf){b.setAttribute("aria-expanded",x.open?"true":"false");b.onclick=function(){x.open=!x.open;S.lv=null;render()}}

 var h="";for(var l=1;l<=7;l++)h+='<button data-l="'+l+'" style="width:'+W[l]+'px" class="'+(l<=deep?"on":"")+'">Level '+l+"</button>";
